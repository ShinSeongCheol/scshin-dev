<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{backoffice/layouts/newPostLayout}" lang="kr" class="scroll-smooth" data-theme=""
>
    <header layout:fragment="header" class="flex justify-between items-center sticky top-0 z-50 bg-white/90 backdrop-blur-sm py-3 px-4 md:px-8 border-b border-gray-200">

        <div class="flex items-center">
            <button id="cancel-button" class="flex items-center gap-1.5 md:gap-2 text-gray-500 hover:text-gray-800 transition-colors cursor-pointer text-sm font-medium px-2 py-2 -ml-2 rounded-lg hover:bg-gray-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span class="hidden sm:block">나가기</span>
            </button>
        </div>

        <div class="flex items-center gap-2 md:gap-3">

            <button id="delete-button" class="px-3 py-2 md:px-4 rounded-lg text-sm font-medium text-red-500 hover:text-red-700 hover:bg-red-50 transition-colors cursor-pointer flex items-center gap-1.5">
                <span th:replace="~{fragements/icons :: icon-trash('16px', '16px', 'currentColor')}"></span>
                <span class="hidden sm:block">삭제</span>
            </button>

            <div class="hidden sm:block w-px h-4 bg-gray-300 mx-1"></div>

            <button id="draft-button" class="px-3 py-2 md:px-4 rounded-lg text-sm font-medium text-gray-600 bg-transparent hover:bg-gray-100 transition-colors cursor-pointer">
                임시저장
            </button>

            <button id="upload-button" class="px-3 py-2 md:px-5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white shadow-sm hover:shadow-md transition-all duration-200 flex justify-center items-center gap-2 cursor-pointer">
                <span th:replace="~{fragements/icons :: icon-check('18px', '18px', 'text-white')}"></span>
                <span class="hidden sm:block text-sm font-medium">수정 완료</span>
            </button>

        </div>
    </header>

    <main layout:fragment="content" class="flex justify-center sm:p-4 min-h-dvh">
        <form id="post-form" class="w-full lg:w-7xl bg-white flex flex-col rounded-xl shadow-xl">
            <label>
                <input name="id" type="hidden" th:value="${post.id()}"/>
            </label>
            <div class="flex justify-between gap-2 p-4">
                <label class="flex-1 ">
                    <input
                            name="title"
                            type="text"
                            placeholder="제목을 입력하세요"
                            class="w-full text-xl lg:text-3xl font-bold outline-none placeholder:text-gray-300"
                            th:value="${post.title()}"
                    />
                </label>
            </div>

            <div class="prose prose-code:text-black max-w-none p-4 h-full">
                <label>
                    <textarea id="post-text-area" name="content" class="field-sizing-content" th:text="${post.content()}"></textarea>
                </label>
            </div>
        </form>
    </main>
    <th:block layout:fragment="script">
        <script th:src="@{/js/common/markdown/easymde.min.js}"></script>
        <script th:src="@{/js/backoffice/views/post/editPost.js}"></script>
    </th:block>
</html>
