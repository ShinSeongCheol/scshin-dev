<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{backoffice/layouts/newPostLayout}" lang="kr" class="scroll-smooth" data-theme=""
>
<header layout:fragment="header" class="flex justify-end items-center sticky top-0 z-50 bg-white/90 backdrop-blur-sm py-3 px-4 md:px-8 border-b border-gray-200">
    <div class="flex items-center gap-2 md:gap-3">
        <button id="draft-button" class="px-3 py-2 md:px-4 rounded-lg text-sm font-medium text-gray-600 bg-transparent hover:bg-gray-100 transition-colors cursor-pointer">
            임시저장
        </button>
        <button id="upload-button" class="px-3 py-2 md:px-5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white shadow-sm hover:shadow-md transition-all duration-200 flex justify-center items-center gap-2 cursor-pointer">
            <span th:replace="~{fragements/icons :: icon-upload('18px', '18px', 'text-white')}"></span>
            <span class="hidden sm:block text-sm font-medium">업로드</span>
        </button>

    </div>
</header>

    <main layout:fragment="content" class="flex justify-center sm:p-4 min-h-dvh">
        <form id="post-form" class="w-full lg:w-7xl bg-white flex flex-col rounded-xl shadow-xl">
            <div class="flex justify-between gap-2 p-4">
                <label class="flex-1">
                    <input
                            name="title"
                            type="text"
                            placeholder="제목을 입력하세요"
                            class="w-full text-xl lg:text-3xl font-bold outline-none placeholder:text-gray-300"
                    />
                </label>
            </div>

            <div class="prose prose-code:text-black max-w-none p-4 h-full">
                <label class="">
                    <textarea id="post-text-area" name="content" class="field-sizing-content"></textarea>
                </label>
            </div>
        </form>
    </main>
    <th:block layout:fragment="script">
        <script th:src="@{/js/common/markdown/easymde.min.js}"></script>
        <script th:src="@{/js/backoffice/views/post/newPost.js}"></script>
    </th:block>
</html>
